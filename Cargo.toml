[package]
name = "pactara-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
borsh = "1.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[dev-dependencies]
ed25519-dalek = "2"
